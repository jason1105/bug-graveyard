name: Write Bug Epitaph

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_title:
        description: 'Issue title (for testing)'
        required: true
        default: 'NullPointerException in UserService.getById()'
      issue_body:
        description: 'Issue body (for testing)'
        required: false
        default: 'Calling getById() with a deleted user ID causes NPE and crashes the entire request thread.'
      issue_number:
        description: 'Issue number (for testing)'
        required: false
        default: '42'
      issue_labels:
        description: 'Comma-separated labels (for testing)'
        required: false
        default: 'bug,critical,backend'

jobs:
  write-epitaph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write   # notify 步骤需要开 issue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai

      - name: Generate epitaph
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # 过渡期保留 OpenRouter 兜底，切稳后可删
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Issue event fields
          EVENT_ISSUE_TITLE: ${{ github.event.issue.title }}
          EVENT_ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_ISSUE_URL: ${{ github.event.issue.html_url }}
          EVENT_ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          EVENT_ISSUE_CLOSED_AT: ${{ github.event.issue.closed_at }}
          EVENT_ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
          # workflow_dispatch override fields
          INPUT_TITLE: ${{ github.event.inputs.issue_title }}
          INPUT_BODY: ${{ github.event.inputs.issue_body }}
          INPUT_NUMBER: ${{ github.event.inputs.issue_number }}
          INPUT_LABELS: ${{ github.event.inputs.issue_labels }}
          REPO_FULL_NAME: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/write_epitaph.py

      - name: Commit and push
        run: |
          git config user.name  "Bug Undertaker Bot"
          git config user.email "bot@bug-graveyard.github.io"
          git add epitaphs/epitaphs.json
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "⚰️ Bury issue #${{ github.event.issue.number || github.event.inputs.issue_number }}: ${{ github.event.issue.title || github.event.inputs.issue_title }}"
          # --- 改造：bot 不再直推 main，改为开 PR 并自动合并 ---
          git fetch origin main --depth=1 -q
          if [ -z "$(git log FETCH_HEAD..HEAD --oneline)" ]; then
            echo "No new commits; nothing to do."
            exit 0
          fi
          BRANCH="bot/$(date -u +%Y%m%d-%H%M%S)"
          git push -u origin "HEAD:$BRANCH"
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          gh pr create --base main --head "$BRANCH" \
            --title "$(git log -1 --pretty=%s)" \
            --body "Automated update by workflow: ${{ github.workflow }}"
          gh pr merge "$BRANCH" --squash --delete-branch

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ 工作流 ${{ github.workflow }} 运行失败"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="[${{ github.workflow }}]($RUN_URL) 于 $(date -u '+%Y-%m-%d %H:%M UTC') 失败（触发 ${{ github.event_name }}）。请查看日志。"
          EXISTING=$(gh issue list --state open --search "in:title $TITLE" --json number,title \
                     --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create ci-failure --color d73a4a --description "自动化工作流失败告警" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label ci-failure 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi

